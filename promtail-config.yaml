server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://chatbot-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          # Only tail chatbot service containers (skip infra noise)
          - name: name
            values:
              - chatbot-backend
              - chatbot-worker
              - chatbot-beat
    relabel_configs:
      # Strip the leading slash from the container name
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      # Identify stdout vs stderr
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      # Stable job label for Grafana queries
      - replacement: chatbot
        target_label: job
      # Derive a short service name: chatbot-backend → backend
      - source_labels: ["__meta_docker_container_name"]
        regex: "/chatbot-(.*)"
        target_label: service
    pipeline_stages:
      # Extract Python log level from log lines like:
      #   2026-06-13 15:28:48,541 WARNING app.api.websocket ...
      - regex:
          expression: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} (?P<level>DEBUG|INFO|WARNING|ERROR|CRITICAL)'
      - labels:
          level:
      # Drop noisy health-check lines to reduce Loki ingestion
      - drop:
          expression: '(GET /health HTTP)|(healthcheck)'
